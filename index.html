<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Моя Творческая Студия</title>
    <style>
        /* Задний фон сайта fon.png */
        body {
            background-image: url('fon.png');
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            background-color: #121212;
            margin: 0;
            padding: 0;
            text-align: center;
        }
        
        /* Главный контейнер сайта */
        .container {
            max-width: 1000px;
            margin: 0 auto;
            padding: 40px 20px;
        }

        /* Картинка-заголовок Welcome */
        .welcome-img {
            display: block;
            max-width: 450px;
            width: 100%;
            height: auto;
            margin: 20px auto;
        }

        /* Картинка-заголовок Игры и Комиксы */
        .games-comics-img {
            display: block;
            max-width: 550px;
            width: 100%;
            height: auto;
            margin: 40px auto 20px auto;
        }

        /* Группы кнопок соцсетей в ряд */
        .social-row {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 20px;
            margin: 20px 0 40px 0;
        }
        
        /* Картинки-кнопки (соцсети сверху) */
        .custom-btn {
            display: inline-block;
            transition: transform 0.2s, filter 0.2s;
            cursor: pointer;
        }
        .custom-btn:hover {
            transform: scale(1.08);
            filter: drop-shadow(0 0 12px rgba(204, 255, 0, 0.5));
        }
        .custom-btn img {
            display: block;
            max-width: 180px;
            height: auto;
        }

        /* Сетка для игр и комиксов (3 колонки по твоей схеме) */
        .grid-container {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 30px;
            margin-top: 30px;
        }

        /* Колонки для кнопок */
        .grid-column {
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        /* Игровые и кастомные кнопки-картинки в сетке */
        .game-btn {
            display: block;
            transition: transform 0.2s, filter 0.2s;
        }
        .game-btn:hover {
            transform: scale(1.05);
            filter: drop-shadow(0 0 10px rgba(255, 255, 255, 0.4));
        }
        .game-btn img {
            display: block;
            width: 100%;
            max-width: 280px;
            height: auto;
            margin: 0 auto;
        }

        /* Адаптивность для мобильных устройств */
        @media (max-width: 768px) {
            .grid-container {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>

    <div class="container">
        
        <!-- 1. Наверху КАРТИНКА WELCOME -->
        <img src="welcome.png" alt="WELCOME" class="welcome-img">

        <!-- 2. Ниже соцсети в ряд -->
        <div class="social-row">
            <a href="https://t.me" target="_blank" class="custom-btn">
                <img src="telegram.png" alt="Telegram">
            </a>
            <a href="https://gamejolt.com" target="_blank" class="custom-btn">
                <img src="gamejoltpng.png" alt="Gamejolt">
            </a>
        </div>

        <!-- 3. По центру КАРТИНКА Игры и Комиксы -->
        <img src="gamesandcomics.png" alt="Игры и Комиксы" class="games-comics-img">

        <!-- 4. Сетка из 3-х колонок -->
        <div class="grid-container">
            
            <!-- ЛЕВАЯ КОЛОНКА: Никсо 1, Никсо 2, Антиворлд 2 -->
            <div class="grid-column">
                <!-- Игра 1: NIXO: the horror game -->
                <a href="https://gamejolt.com" target="_blank" class="game-btn">
                    <img src="nixo1.png" alt="NIXO 1">
                </a>
                <!-- Игра 2: Five Night's At NIXO -->
                <a href="https://gamejolt.com" target="_blank" class="game-btn">
                    <img src="nixo2.png" alt="Five Nights At NIXO">
                </a>
                <!-- Игра 3: ANTIWORLD 2D: CLASSIC -->
                <a href="https://gamejolt.com" target="_blank" class="game-btn">
                    <img src="antiworld2.png" alt="ANTIWORLD 2D">
                </a>
            </div>

            <!-- СРЕДНЯЯ КОЛОНКА: Антиворлд 3, Ротен Молтен, Антипокас Крейзи Хаус -->
            <div class="grid-column">
                <!-- Игра 4: Antiworld 3D: Overthrow -->
                <a href="https://gamejolt.com" target="_blank" class="game-btn">
                    <img src="antiworld3.png" alt="Antiworld 3D">
                </a>
                <!-- Игра 5: Roten Molten (вернулась сюда, имя слитное) -->
                <a href="https://gamejolt.com" target="_blank" class="game-btn">
                    <img src="rotenmolten.png" alt="Roten Molten">
                </a>
                <!-- Игра 6: ANTIPOKA'S CRAZY HOUSE -->
                <a href="https://gamejolt.com" target="_blank" class="game-btn">
                    <img src="antipokascrazyhouse.png" alt="Antipoka's Crazy House">
                </a>
            </div>

            <!-- ПРАВАЯ КОЛОНКА: Комикс и под ним кнопка Телеграма -->
            <div class="grid-column">
                <!-- Твой Комикс -->
                <a href="ССЫЛКА_НА_КОМИКС" target="_blank" class="game-btn">
                    <img src="comics.png" alt="Комиксы">
                </a>
                <!-- Вторая кнопка Телеграма под комиксом -->
                <a href="https://t.me" target="_blank" class="game-btn">
                    <img src="telegram.png" alt="Telegram Link">
                </a>
            </div>

        </div>

    </div>

</body>
</html>
