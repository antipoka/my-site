<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ANTIPOKA'S DELIRIUM</title>
    <style>
        /* Задний фон сайта fon.png */
        body {
            background-image: url('fon.png');
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            background-color: #121212;
            margin: 0;
            padding: 0;
            text-align: center;
        }
        
        /* Главный контейнер */
        .container {
            max-width: 1000px;
            margin: 0 auto;
            padding: 30px 20px;
        }

        /* Upper social media row */
        .top-social-row {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 20px;
            margin-top: 10px;
            margin-bottom: 30px;
        }
        
        .custom-btn {
            display: inline-block;
            transition: transform 0.2s, filter 0.2s;
            cursor: pointer;
        }
        .custom-btn:hover {
            transform: scale(1.08);
            filter: drop-shadow(0 0 12px rgba(204, 255, 0, 0.5));
        }
        .custom-btn img {
            display: block;
            max-width: 150px;
            height: auto;
        }

        /* Заголовок Welcome */
        .welcome-img {
            display: block;
            max-width: 450px;
            width: 100%;
            height: auto;
            margin: 0 auto 20px auto;
        }

        /* Заголовок Игры и Комиксы */
        .games-comics-img {
            display: block;
            max-width: 550px;
            width: 100%;
            height: auto;
            margin: 0 auto 40px auto;
        }

        /* Сетка из 3-х колонок для комиксов */
        .comics-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 30px;
            margin-top: 20px;
            margin-bottom: 50px;
        }

        .comic-card {
            display: block;
            transition: transform 0.2s, filter 0.2s;
            cursor: pointer;
        }
        .comic-card.active:hover {
            transform: scale(1.06);
            filter: drop-shadow(0 0 15px rgba(204, 255, 0, 0.6));
        }
        .comic-card.disabled {
            cursor: default;
            opacity: 0.5;
            filter: grayscale(30%);
        }
        .comic-card img {
            display: block;
            width: 100%;
            max-width: 280px;
            height: auto;
            margin: 0 auto;
            border-radius: 6px;
        }

        /* Нижний блок: Описание игры + Арт с фоном button.png и шрифтом Comic Sans */
        .game-section {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 40px;
            margin: 40px auto;
            padding: 45px 35px;
            background-image: url('button.png');
            background-size: 100% 100%;
            background-repeat: no-repeat;
            background-position: center;
            background-color: transparent;
            border: none;
            text-align: left;
            box-sizing: border-box;
            font-family: "Comic Sans MS", "Chalkboard SE", "Comic Neue", sans-serif;
        }

        /* Левая колонка с красным текстом и кнопкой скачать */
        .game-info-col {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: flex-start;
            gap: 20px;
        }

        .game-section h2 {
            color: #ff0000;
            margin: 0;
            font-size: 2em;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.8);
        }

        .game-section p {
            color: #ff3333;
            line-height: 1.6;
            font-size: 1.1em;
            margin: 0;
            font-weight: bold;
            text-shadow: 1px 1px 3px rgba(0,0,0,0.8);
        }

        /* Правая колонка с картинкой-артом */
        .game-art-col {
            flex: 1;
        }

        .game-art-col img {
            display: block;
            width: 100%;
            max-width: 440px;
            height: auto;
            border-radius: 8px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.5);
            margin: 0 auto;
        }

        /* Кнопка скачать картинкой download.png */
        .download-btn {
            display: inline-block;
            transition: transform 0.2s, filter 0.2s;
            cursor: pointer;
            margin-top: 10px;
        }
        .download-btn:hover {
            transform: scale(1.05);
            filter: drop-shadow(0 0 12px rgba(255, 255, 255, 0.4));
        }
        .download-btn img {
            display: block;
            max-width: 200px;
            height: auto;
        }

        /* СТИЛИ ИНТЕРАКТИВНОЙ ЧИТАЛКИ КОМИКСОВ */
        .comic-modal {
            display: none;
            position: fixed;
            z-index: 1000;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.97);
            justify-content: center;
            align-items: center;
            flex-direction: column;
        }
        .comic-wrapper {
            max-width: 95%;
            max-height: 82vh;
            overflow: auto;
            display: flex;
            justify-content: center;
            align-items: center;
            border-radius: 6px;
        }
        .comic-page-img {
            max-height: 80vh;
            width: auto;
            height: auto;
            max-width: 100%;
            transition: transform 0.2s ease;
            cursor: zoom-in;
            display: block;
        }
        .comic-page-img.zoomed {
            max-height: none;
            max-width: none;
            transform: scale(1.4);
            cursor: zoom-out;
            margin: 40px;
        }
        .comic-controls {
            margin-top: 15px;
            display: flex;
            gap: 25px;
            align-items: center;
            z-index: 1010;
        }
        .comic-img-btn {
            display: inline-block;
            cursor: pointer;
            transition: transform 0.2s;
        }
        .comic-img-btn:hover { transform: scale(1.1); }
        .comic-img-btn img {
            display: block;
            max-width: 110px;
            height: auto;
        }
        .comic-close-btn {
            position: absolute;
            top: 20px;
            right: 30px;
            color: #fff;
            font-size: 45px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.2s;
            z-index: 1020;
        }
        .comic-close-btn:hover { color: #ccff00; }
        .page-counter {
            color: #fff;
            font-family: sans-serif;
            font-size: 18px;
            user-select: none;
            font-weight: bold;
        }

        /* Адаптивность для мобилок */
        @media (max-width: 768px) {
            .comics-grid {
                grid-template-columns: 1fr;
                gap: 40px;
            }
            .game-section {
                background-size: cover;
                flex-direction: column-reverse;
                text-align: center;
            }
            .game-info-col {
                align-items: center;
            }
            .comic-page-img.zoomed {
                transform: scale(2.0);
            }
        }
    </style>
</head>
<body>
    <div class="container">
        
        <!-- 1. Соцсети на самом верху в ряд -->
        <div class="top-social-row">
            <a href="https://t.me/+5tdyo3_NtHgzODMy" target="_blank" class="custom-btn">
                <img src="telegram.png" alt="Telegram">
            </a>
            <a href="https://gamejolt.com/@Antipokasgames" target="_blank" rel="noreferrer" class="custom-btn">
                <img src="gamejoltpng.png" alt="Gamejolt">
            </a>
        </div>

        <!-- 2. Ниже картинка WELCOME -->
        <img src="welcome.png" alt="WELCOME" class="welcome-img">

        <!-- 3. Ниже картинка Игры и Комиксы -->
        <img src="gamesandcomics.png" alt="Игры и Комиксы" class="games-comics-img">

        <!-- 4. Сетка из 3-х вертикальных боксов комиксов -->
        <div class="comics-grid">
            <!-- Бокс 1: Первый комикс (Antipoka's Delirium) -->
            <div onclick="openComic(1)" class="comic-card active">
                <img src="comics.png" alt="Antipoka's Delirium">
            </div>
            <!-- Бокс 2: Второй комикс (WHAT IF) — ТЕПЕРЬ АКТИВНЫЙ! -->
            <div onclick="openComic(2)" class="comic-card active">
                <img src="comics2.png" alt="WHAT IF">
            </div>
            <!-- Бокс 3: Анонс третьего комикса -->
            <div class="comic-card disabled" title="Coming Soon!">
                <img src="comics3.png" alt="Future Comic 3">
            </div>
        </div>

        <!-- 5. Нижний блок: Английский текст в рамке button.png, Скриншот screen.png справа -->
        <div class="game-section">
            <div class="game-info-col">
                <h2>ANTIWORLD 3D: OVERTHROW / ANTIPOKA'S DELIRIUM (THE GAME)</h2>
                <p>This old, unfinished game became the core foundation for my comic's universe! Download its archive directly from the site to see where this whole story and the characters' adventures first began.</p>
                <a href="ANTIPOKA'S DELIRIUM.zip" download class="download-btn">
                    <img src="download.png" alt="Download">
                </a>
            </div>
            <div class="game-art-col">
                <img src="screen.png" alt="Game Screenshot">
            </div>
        </div>

    </div>

    <!-- ОКНО ИНТЕРАКТИВНОЙ ЧИТАЛКИ -->
    <div id="comicModal" class="comic-modal">
        <span class="comic-close-btn" onclick="closeComic()">&times;</span>
        <div class="comic-wrapper">
            <img id="comicPage" src="" alt="Comic Page" class="comic-page-img" onclick="toggleZoom()">
        </div>
        <div class="comic-controls">
            <div class="comic-img-btn" onclick="prevPage()">
                <img src="BACK.png" alt="Back">
            </div>
            <span id="pageCounter" class="page-counter">Cover</span>
            <div class="comic-img-btn" onclick="nextPage()">
                <img src="NEXT.png" alt="Next">
            </div>
        </div>
    </div>

    <!-- СКРИПТ УПРАВЛЕНИЯ ДВУМЯ РАЗНЫМИ КОМИКСАМИ -->
    <script>
        let currentComic = 1;
        let currentIndex = 0;
        
        // Массив страниц для Первого Комикса (Antipoka's Delirium)
        const deliriumPages = [
            { src: "antipokasdeliriumvol1.png", label: "Cover Part 1" },
            { src: "vol1page1.png", label: "Part 1 — Page 1" },
            { src: "vol1page2.png", label: "Part 1 — Page 2" },
            { src: "vol1page3.png", label: "Part 1 — Page 3" },
            { src: "vol1page4.png", label: "Part 1 — Page 4" },
            { src: "antipokasdeliriumvol1part2.png", label: "Cover Part 2" },
            { src: "vol1part2page1.png", label: "Part 2 — Page 1" },
            { src: "vol1part2page2.png", label: "Part 2 — Page 2" },
            { src: "vol1part2page3.png", label: "Part 2 — Page 3" }
        ];

        // Массив страниц для Второго Комикса (WHAT IF) — строго по твоему списку
        const whatifPages = [
            { src: "WHATIF.png", label: "WHAT IF — Cover" },
            { src: "WHATIFspoiler.png", label: "WARNING — Spoiler!" },
            { src: "WHATIFpage1.png", label: "Part 1 — Page 1" },
            { src: "WHATIFpage2.png", label: "Part 1 — Page 2" },
            { src: "WHATIFpage3.png", label: "Part 1 — Page 3" },
            { src: "WHATIFpage4.png", label: "Part 1 — Page 4" },
            { src: "WHATIFpart2page1.png", label: "Part 2 — Page 1" },
            { src: "WHATIFpart2page2.png", label: "Part 2 — Page 2" },
            { src: "WHATIFpart2page3.png", label: "Part 2 — Page 3" }
        ];

        function openComic(comicNumber) {
            currentComic = comicNumber;
            currentIndex = 0;
            resetZoom();
            updateModal();
            document.getElementById("comicModal").style.display = "flex";
        }
        function closeComic() {
            resetZoom();
            document.getElementById("comicModal").style.display = "none";
        }
        function nextPage() {
            const activePages = currentComic === 1 ? deliriumPages : whatifPages;
            if (currentIndex < activePages.length - 1) {
                currentIndex++;
                resetZoom();
                updateModal();
            }
        }
        function prevPage() {
            if (currentIndex > 0) {
                currentIndex--;
                resetZoom();
                updateModal();
            }
        }
        function updateModal() {
            const activePages = currentComic === 1 ? deliriumPages : whatifPages;
            document.getElementById("comicPage").src = activePages[currentIndex].src;
            document.getElementById("pageCounter").innerText = activePages[currentIndex].label;
        }
        function toggleZoom() {
            document.getElementById("comicPage").classList.toggle("zoomed");
        }
        function resetZoom() {
            document.getElementById("comicPage").classList.remove("zoomed");
        }
        window.addEventListener('keydown', function (event) {
            if (event.key === 'Escape') closeComic();
        });
    </script>

</body>
</html>
