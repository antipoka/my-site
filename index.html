
<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Моя Творческая Студия</title>
    <style>
        /* Настройка заднего фона сайта */
        body {
            background-image: url('fon.png');
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            background-color: #121212; /* Запасной цвет, если фон долго грузится */
            color: #ffffff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 0;
            text-align: center;
        }

        /* Контейнер для выравнивания контента */
        .container {
            max-width: 800px;
            margin: 0 auto;
            padding: 60px 20px;
            background: rgba(0, 0, 0, 0.6); /* Полупрозрачная подложка, чтобы текст хорошо читался на любом фоне */
            border-radius: 16px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.5);
            margin-top: 40px;
            margin-bottom: 40px;
        }

        h1 {
            font-size: 2.8em;
            margin-bottom: 10px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.8);
        }

        p {
            font-size: 1.1em;
            line-height: 1.6;
            color: #ddd;
            margin-bottom: 40px;
        }

        /* Стили для твоих кастомных картинок-кнопок */
        .custom-btn {
            display: inline-block;
            margin: 15px;
            transition: transform 0.2s, filter 0.2s;
            cursor: pointer;
        }

        /* Эффект при наведении курсора (кнопка слегка увеличивается и начинает светиться) */
        .custom-btn:hover {
            transform: scale(1.08);
            filter: drop-shadow(0 0 10px rgba(255, 255, 255, 0.6));
        }

        /* Настройка размера картинок внутри кнопок */
        .custom-btn img {
            display: block;
            max-width: 220px; /* Можешь изменить размер кнопок (больше/меньше), меняя это число */
            height: auto;
        }

        .flex-buttons {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            align-items: center;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>Добро пожаловать! 👋</h1>
        <p>Привет! Я создаю игры, рисую комиксы и делюсь своим творчеством. Ниже ты найдешь ссылки на мои главные проекты, сможешь скачать файлы или связаться со мной.</p>

        <!-- Блок со всеми кастомными кнопками-картинками -->
        <div class="flex-buttons">

            <!-- Кнопка Game Jolt -->
            <!-- Замени ССЫЛКА_НА_GAMEJOLT на реальный адрес своей страницы -->
            <a href="ССЫЛКА_НА_GAMEJOLT" target="_blank" class="custom-btn">
                <img src="gamejoltpng.png" alt="Game Jolt">
            </a>

            <!-- Кнопка Скачать (Игра или Комикс) -->
            <!-- Замени ССЫЛКА_НА_СКАЧИВАНИЕ на прямую ссылку (например, на Google/Яндекс Диск) -->
            <a href="ССЫЛКА_НА_СКАЧИВАНИЕ" target="_blank" class="custom-btn">
                <img src="download.png" alt="Скачать">
            </a>

            <!-- Кнопка Телеграм -->
            <!-- Замени ССЫЛКА_НА_ТЕЛЕГРАМ на ссылку на свой канал или профиль -->
            <a href="ССЫЛКА_НА_ТЕЛЕГРАМ" target="_blank" class="custom-btn">
                <img src="telegram.png" alt="Telegram">
            </a>

        </div>
    </div>

</body>
</html>
