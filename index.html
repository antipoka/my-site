<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ANTIPOKA'S DELIRIUM</title>
    <style>
        /* Задний фон сайта fon.png */
        body {
            background-image: url('fon.png');
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            background-color: #121212;
            margin: 0;
            padding: 0;
            text-align: center;
        }
        
        /* Главный контейнер */
        .container {
            max-width: 800px;
            margin: 0 auto;
            padding: 30px 20px;
        }

        /* 1. Верхний ряд соцсетей */
        .top-social-row {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 20px;
            margin-top: 10px;
            margin-bottom: 30px;
        }
        
        .custom-btn {
            display: inline-block;
            transition: transform 0.2s, filter 0.2s;
            cursor: pointer;
        }
        .custom-btn:hover {
            transform: scale(1.08);
            filter: drop-shadow(0 0 12px rgba(204, 255, 0, 0.5));
        }
        .custom-btn img {
            display: block;
            max-width: 150px;
            height: auto;
        }

        /* 2. Заголовок Welcome */
        .welcome-img {
            display: block;
            max-width: 450px;
            width: 100%;
            height: auto;
            margin: 0 auto 20px auto;
        }

        /* 3. Заголовок Игры и Комиксы */
        .games-comics-img {
            display: block;
            max-width: 550px;
            width: 100%;
            height: auto;
            margin: 0 auto 30px auto;
        }

        /* 4. Главная кнопка комикса */
        .main-comic-btn {
            display: inline-block;
            margin: 10px auto 40px auto;
            transition: transform 0.2s, filter 0.2s;
            cursor: pointer;
        }
        .main-comic-btn:hover {
            transform: scale(1.06);
            filter: drop-shadow(0 0 20px rgba(204, 255, 0, 0.6));
        }
        .main-comic-btn img {
            display: block;
            max-width: 380px;
            width: 100%;
            height: auto;
        }

        /* СТИЛИ ИНТЕРАКТИВНОЙ ЧИТАЛКИ */
        .comic-modal {
            display: none;
            position: fixed;
            z-index: 1000;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.97);
            justify-content: center;
            align-items: center;
            flex-direction: column;
        }
        .comic-wrapper {
            max-width: 95%;
            max-height: 82vh;
            overflow: auto;
            display: flex;
            justify-content: center;
            align-items: center;
            border-radius: 6px;
        }
        .comic-page-img {
            max-height: 80vh;
            width: auto;
            height: auto;
            max-width: 100%;
            transition: transform 0.2s ease;
            cursor: zoom-in;
            display: block;
        }
        .comic-page-img.zoomed {
            max-height: none;
            max-width: none;
            transform: scale(1.4);
            cursor: zoom-out;
            margin: 40px;
        }
        .comic-controls {
            margin-top: 15px;
            display: flex;
            gap: 25px;
            align-items: center;
            z-index: 1010;
        }
        .comic-img-btn {
            display: inline-block;
            cursor: pointer;
            transition: transform 0.2s;
        }
        .comic-img-btn:hover { transform: scale(1.1); }
        .comic-img-btn img {
            display: block;
            max-width: 110px;
            height: auto;
        }
        .comic-close-btn {
            position: absolute;
            top: 20px;
            right: 30px;
            color: #fff;
            font-size: 45px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.2s;
            z-index: 1020;
        }
        .comic-close-btn:hover { color: #ccff00; }
        .page-counter {
            color: #fff;
            font-family: sans-serif;
            font-size: 18px;
            user-select: none;
            font-weight: bold;
        }
    </style>
</head>
<body>

    <div class="container">
        
        <!-- 1. Соцсети на самом верху в ряд -->
        <div class="top-social-row">
            <a href="https://t.me" target="_blank" class="custom-btn">
                <img src="telegram.png" alt="Telegram">
            </a>
            <a href="https://gamejolt.com" target="_blank" rel="noreferrer" class="custom-btn">
                <img src="gamejoltpng.png" alt="Gamejolt">
            </a>
        </div>

        <!-- 2. Ниже картинка WELCOME -->
        <img src="welcome.png" alt="WELCOME" class="welcome-img">

        <!-- 3. Ниже картинка Игры и Комиксы -->
        <img src="gamesandcomics.png" alt="Игры и Комиксы" class="games-comics-img">

        <!-- 4. Центральная кнопка комикса -->
        <div onclick="openComic()" class="main-comic-btn">
            <img src="comics.png" alt="Читать Комикс">
        </div>

    </div>

    <!-- ОКНО ИНТЕРАКТИВНОЙ ЧИТАЛКИ -->
    <div id="comicModal" class="comic-modal">
        <span class="comic-close-btn" onclick="closeComic()">&times;</span>
        <div class="comic-wrapper">
            <img id="comicPage" src="antipokasdeliriumvol1.png" alt="Страница комикса" class="comic-page-img" onclick="toggleZoom()">
        </div>
        <div class="comic-controls">
            <!-- Стрелка НАЗАД (BACK.png) -->
            <div class="comic-img-btn" onclick="prevPage()">
                <img src="BACK.png" alt="Назад">
            </div>
            <span id="pageCounter" class="page-counter">Обложка Ч.1</span>
            <!-- Стрелка ВПЕРЕД (NEXT.png) -->
            <div class="comic-img-btn" onclick="nextPage()">
                <img src="NEXT.png" alt="Вперед">
            </div>
        </div>
    </div>

    <!-- СКРИПТ УПРАВЛЕНИЯ ЛИСТАЛКОЙ -->
    <script>
        let currentIndex = 0;
        
        // Массив всех твоих страниц по порядку
        const comicPages = [
            { src: "antipokasdeliriumvol1.png", label: "Обложка Ч.1" },
            { src: "vol1page1.png", label: "Часть 1 — Стр. 1" },
            { src: "vol1page2.png", label: "Часть 1 — Стр. 2" },
            { src: "vol1page3.png", label: "Часть 1 — Стр. 3" },
            { src: "vol1page4.png", label: "Часть 1 — Стр. 4" },
            { src: "antipokasdeliriumvol1part2.png", label: "Обложка Ч.2" },
            { src: "vol1part2page1.png", label: "Часть 2 — Стр. 1" },
            { src: "vol1part2page2.png", label: "Часть 2 — Стр. 2" },
            { src: "vol1part2page3.png", label: "Часть 2 — Стр. 3" }
        ];

        function openComic() {
            currentIndex = 0;
            resetZoom();
            updateModal();
            document.getElementById("comicModal").style.display = "flex";
        }
        function closeComic() {
            resetZoom();
            document.getElementById("comicModal").style.display = "none";
        }
        function nextPage() {
            if (currentIndex < comicPages.length - 1) {
                currentIndex++;
                resetZoom();
                updateModal();
            }
        }
        function prevPage() {
            if (currentIndex > 0) {
                currentIndex--;
                resetZoom();
                updateModal();
            }
        }
        function updateModal() {
            document.getElementById("comicPage").src = comicPages[currentIndex].src;
            document.getElementById("pageCounter").innerText = comicPages[currentIndex].label;
        }
        function toggleZoom() {
            document.getElementById("comicPage").classList.toggle("zoomed");
        }
        function resetZoom() {
            document.getElementById("comicPage").classList.remove("zoomed");
        }
        window.addEventListener('keydown', function (event) {
            if (event.key === 'Escape') closeComic();
        });
    </script>

</body>
</html>
