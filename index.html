<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Моя Творческая Студия</title>
    <style>
        /* Задний фон сайта fon.png */
        body {
            background-image: url('fon.png');
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            background-color: #121212;
            margin: 0;
            padding: 0;
            text-align: center;
        }
        
        /* Главный контейнер сайта */
        .container {
            max-width: 1000px;
            margin: 0 auto;
            padding: 40px 20px;
        }

        /* Картинка-заголовок Welcome */
        .welcome-img {
            display: block;
            max-width: 450px;
            width: 100%;
            height: auto;
            margin: 20px auto;
        }

        /* Картинка-заголовок Игры и Комиксы */
        .games-comics-img {
            display: block;
            max-width: 550px;
            width: 100%;
            height: auto;
            margin: 40px auto 20px auto;
        }

        /* Группы кнопок соцсетей в ряд */
        .social-row {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 20px;
            margin: 20px 0 40px 0;
        }
        
        /* Картинки-кнопки (соцсети сверху) */
        .custom-btn {
            display: inline-block;
            transition: transform 0.2s, filter 0.2s;
            cursor: pointer;
        }
        .custom-btn:hover {
            transform: scale(1.08);
            filter: drop-shadow(0 0 12px rgba(204, 255, 0, 0.5));
        }
        .custom-btn img {
            display: block;
            max-width: 180px;
            height: auto;
        }

        /* Сетка для игр и комиксов (3 колонки) */
        .grid-container {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 30px;
            margin-top: 30px;
        }

        /* Колонки для кнопок */
        .grid-column {
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        /* Игровые и кастомные кнопки-картинки в сетке */
        .game-btn {
            display: block;
            transition: transform 0.2s, filter 0.2s;
            cursor: pointer;
        }
        .game-btn:hover {
            transform: scale(1.05);
            filter: drop-shadow(0 0 10px rgba(255, 255, 255, 0.4));
        }
        .game-btn img {
            display: block;
            width: 100%;
            max-width: 280px;
            height: auto;
            margin: 0 auto;
        }

        /* СТИЛИ ДЛЯ ИНТЕРАКТИВНОЙ ЧИТАЛКИ КОМИКСА */
        .comic-modal {
            display: none;
            position: fixed;
            z-index: 1000;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.97);
            justify-content: center;
            align-items: center;
            flex-direction: column;
        }

        /* Контейнер для скролла при зуме */
        .comic-wrapper {
            max-width: 95%;
            max-height: 82vh;
            overflow: auto;
            display: flex;
            justify-content: center;
            align-items: center;
            border-radius: 6px;
        }

        /* Крупная страница комикса */
        .comic-page-img {
            max-height: 80vh;
            width: auto;
            height: auto;
            max-width: 100%;
            transition: transform 0.2s ease;
            cursor: zoom-in;
            display: block;
        }

        /* Приближенная страница */
        .comic-page-img.zoomed {
            max-height: none;
            max-width: none;
            transform: scale(1.4);
            cursor: zoom-out;
            margin: 40px;
        }

        /* Панель со стрелками */
        .comic-controls {
            margin-top: 15px;
            display: flex;
            gap: 25px;
            align-items: center;
            z-index: 1010;
        }

        /* Настройка кнопок-картинок BACK и NEXT */
        .comic-img-btn {
            display: inline-block;
            cursor: pointer;
            transition: transform 0.2s;
        }
        .comic-img-btn:hover {
            transform: scale(1.1);
        }
        .comic-img-btn img {
            display: block;
            max-width: 120px;
            height: auto;
        }

        .comic-close-btn {
            position: absolute;
            top: 20px;
            right: 30px;
            color: #fff;
            font-size: 45px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.2s;
            z-index: 1020;
        }
        .comic-close-btn:hover { color: #ccff00; }

        .page-counter {
            color: #fff;
            font-family: sans-serif;
            font-size: 18px;
            user-select: none;
            font-weight: bold;
        }

        /* Адаптивность для мобилок */
        @media (max-width: 768px) {
            .grid-container {
                grid-template-columns: 1fr;
            }
            .comic-page-img.zoomed {
                transform: scale(2.0);
            }
        }
    </style>
</head>
<body>
    <div class="container">
        
        <!-- 1. Наверху КАРТИНКА WELCOME -->
        <img src="welcome.png" alt="WELCOME" class="welcome-img">

        <!-- 2. Ниже соцсети в ряд -->
        <div class="social-row">
            <a href="https://t.me" target="_blank" class="custom-btn">
                <img src="telegram.png" alt="Telegram">
            </a>
            <a href="https://gamejolt.com" target="_blank" rel="noreferrer" class="custom-btn">
                <img src="gamejoltpng.png" alt="Gamejolt">
            </a>
        </div>

        <!-- 3. По центру КАРТИНКА Игры и Комиксы -->
        <img src="gamesandcomics.png" alt="Игры и Комиксы" class="games-comics-img">

        <!-- 4. Сетка из 3-х колонок -->
        <div class="grid-container">
            
            <!-- ЛЕВАЯ КОЛОНКА -->
            <div class="grid-column">
                <a href="https://gamejolt.com" target="_blank" rel="noreferrer" class="game-btn">
                    <img src="nixo1.png" alt="NIXO 1">
                </a>
                <a href="https://gamejolt.com" target="_blank" rel="noreferrer" class="game-btn">
                    <img src="nixo2.png" alt="Five Nights At NIXO">
                </a>
                <a href="https://gamejolt.com" target="_blank" rel="noreferrer" class="game-btn">
                    <img src="antiworld2.png" alt="ANTIWORLD 2D">
                </a>
            </div>

            <!-- СРЕДНЯЯ КОЛОНКА -->
            <div class="grid-column">
                <a href="https://gamejolt.com" target="_blank" rel="noreferrer" class="game-btn">
                    <img src="antiworld3.png" alt="Antiworld 3D">
                </a>
                <a href="https://gamejolt.com" target="_blank" rel="noreferrer" class="game-btn">
                    <img src="rotenmolten.png" alt="Roten Molten">
                </a>
                <a href="https://gamejolt.com" target="_blank" rel="noreferrer" class="game-btn">
                    <img src="antipokascrazyhouse.png" alt="Antipoka's Crazy House">
                </a>
            </div>

            <!-- ПРАВАЯ КОЛОНКА -->
            <div class="grid-column">
                <div onclick="openComic()" class="game-btn">
                    <img src="comics.png" alt="Комиксы">
                </div>
                <a href="https://t.me" target="_blank" class="game-btn">
                    <img src="telegram.png" alt="Telegram Link">
                </a>
            </div>

        </div>

    </div>

    <!-- ОКНО ИНТЕРАКТИВНОЙ ЧИТАЛКИ -->
    <div id="comicModal" class="comic-modal">
        <span class="comic-close-btn" onclick="closeComic()">&times;</span>
        
        <div class="comic-wrapper">
            <img id="comicPage" src="antipokasdeliriumvol1.png" alt="Страница комикса" class="comic-page-img" onclick="toggleZoom()">
        </div>
        
        <div class="comic-controls">
            <!-- Стрелка НАЗАД (BACK.png) -->
            <div class="comic-img-btn" onclick="prevPage()">
                <img src="BACK.png" alt="Назад">
            </div>
            
            <span id="pageCounter" class="page-counter">Обложка</span>
            
            <!-- Стрелка ВПЕРЕД (NEXT.png) -->
            <div class="comic-img-btn" onclick="nextPage()">
                <img src="NEXT.png" alt="Вперед">
            </div>
        </div>
    </div>

    <!-- СКРИПТ УПРАВЛЕНИЯ ЛИСТАЛКОЙ И ЗУМОМ -->
    <script>
        let currentPage = 0;
        const totalPages = 4;

        function openComic() {
            currentPage = 0;
            resetZoom();
            updateModal();
            document.getElementById("comicModal").style.display = "flex";
        }

        function closeComic() {
            resetZoom();
            document.getElementById("comicModal").style.display = "none";
        }

        function nextPage() {
            if (currentPage < totalPages) {
                currentPage++;
                resetZoom();
                updateModal();
            }
        }

        function prevPage() {
            if (currentPage > 0) {
                currentPage--;
                resetZoom();
                updateModal();
            }
        }

        function updateModal() {
            const pageImg = document.getElementById("comicPage");
            const counter = document.getElementById("pageCounter");
            
            if (currentPage === 0) {
                pageImg.src = "antipokasdeliriumvol1.png";
                counter.innerText = "Обложка";
            } else {
                pageImg.src = "vol1page" + currentPage + ".png";
                counter.innerText = "Страница " + currentPage + " / " + totalPages;
            }
        }

        function toggleZoom() {
            const pageImg = document.getElementById("comicPage");
            pageImg.classList.toggle("zoomed");
        }

        function resetZoom() {
            const pageImg = document.getElementById("comicPage");
            pageImg.classList.remove("zoomed");
        }

        window.addEventListener('keydown', function (event) {
            if (event.key === 'Escape') {
                closeComic();
            }
        });
    </script>

</body>
</html>
